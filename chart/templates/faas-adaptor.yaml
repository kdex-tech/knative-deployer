apiVersion: kdex.dev/v1alpha1
kind: KDexClusterFaaSAdaptor
metadata:
  labels:
    kdex.dev/default: "true"
    {{- include "kdex-knative-faas-adaptor.labels" . | nindent 4 }}
  name: {{ include "kdex-knative-faas-adaptor.fullname" . }}
spec:
  deployer:
    env:
    - name: DEBUG_SECURITY
      value: "true"
    image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}
    command: ["/deployer", "deploy"]
    serviceAccountName: {{ include "kdex-knative-faas-adaptor.serviceAccountName" . }}
  observer:
    image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}
    command: ["/deployer", "observe"]
    schedule: "*/5 * * * *"
    serviceAccountName: {{ include "kdex-knative-faas-adaptor.serviceAccountName" . }}
  defaultBuilderGenerator: tiny/go
  builders:
  - builderRef:
      kind: ClusterBuilder
      name: tiny-builder
    languages:
    - go
    - rust
    name: tiny
    {{- with .Values.builders.serviceAccountName }}
    serviceAccountName: {{ . | quote }}
    {{- end }}
    {{- with .Values.builders.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.builders.env }}
    env:
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.builders.cache }}
    cache:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  - builderRef:
      kind: ClusterBuilder
      name: base-builder
    languages:
    - nodejs
    - python
    name: base
    {{- with .Values.builders.serviceAccountName }}
    serviceAccountName: {{ . | quote }}
    {{- end }}
    {{- with .Values.builders.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.builders.env }}
    env:
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.builders.cache }}
    cache:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  generators:
  - entrypoint: "./cmd/main.go"
    git:
      image: {{ printf "%s:%s" .Values.generatorGit.image.repository .Values.generatorGit.image.tag | quote }}
      committerEmail: {{ .Values.generatorGit.committerEmail | quote }}
      committerName: {{ .Values.generatorGit.committerName | quote }}
    image: ghcr.io/kdex-tech/fngogen:0.1.6
    language: go
  - entrypoint: "./src/main.ts"
    git:
      image: {{ printf "%s:%s" .Values.generatorGit.image.repository .Values.generatorGit.image.tag | quote }}
      committerEmail: {{ .Values.generatorGit.committerEmail | quote }}
      committerName: {{ .Values.generatorGit.committerName | quote }}
    image: ghcr.io/kdex-tech/fnnodejsgen:0.1.4
    language: nodejs
  provider: knative
