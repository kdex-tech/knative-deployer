{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kdex-knative-faas-adaptor.fullname" . }}
  labels:
    {{- include "kdex-knative-faas-adaptor.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - serving.knative.dev
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - kdex.dev
    resources:
      - kdexfunctions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kdex.dev
    resources:
      - kdexfunctions/status
    verbs:
      - get
      - patch
      - update
{{- if .Values.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kdex-knative-faas-adaptor.fullname" . }}
  labels:
    {{- include "kdex-knative-faas-adaptor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kdex-knative-faas-adaptor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kdex-knative-faas-adaptor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
