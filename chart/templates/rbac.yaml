{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kdex-knative-faas-adaptor.fullname" . }}
  labels:
    {{- include "kdex-knative-faas-adaptor.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - serving.knative.dev
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - kdex.dev
    resources:
      - kdexfunctions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kdex.dev
    resources:
      - kdexfunctions/status
    verbs:
      - get
      - patch
      - update
  # kpack Build auto-recovery: the observe CronJob inspects the
  # kpack.io/Image's latest Build, classifies its failure mode, and
  # for preemption-induced failures bumps an annotation on the Image
  # to trigger a fresh Build. Read on Pod/Node to evaluate the
  # preemption heuristic (DeletionTimestamp, status.reason, node
  # Ready=False, init-container Killed-not-OOMKilled).
  - apiGroups:
      - kpack.io
    resources:
      - images
    verbs:
      - get
      - patch
  - apiGroups:
      - kpack.io
    resources:
      - builds
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
    verbs:
      - get
{{- if .Values.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kdex-knative-faas-adaptor.fullname" . }}
  labels:
    {{- include "kdex-knative-faas-adaptor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kdex-knative-faas-adaptor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kdex-knative-faas-adaptor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
