# Default values for kdex-knative-faas-adaptor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/kdex-tech/knative-deployer
  pullPolicy: IfNotPresent
  # When empty, the chart template falls back to .Chart.AppVersion,
  # which CI overrides to the git tag on each release (see
  # .github/actions/publish-helm-chart/action.yml's `helm package
  # --app-version ${CHART_VERSION}`). Set this to a specific tag here
  # only to pin against a non-release build.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "kdex-knative-faas-adaptor"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # Whether to automount the service account token
  automount: true

rbac:
  create: true

registry:
  # Secret containing registry credentials for kpack
  auth:
    secretName: kdex-registry-auth
  # Registry to use for kpack builders (e.g. registry.kube-system.svc.cluster.local:5000)
  url: "registry.kube-system.svc.cluster.local:5000"

# Install the bundled Knative Serving (CRDs + core). Disable when Knative
# Serving is managed externally; the deployer requires the serving.knative.dev
# CRDs to be present at runtime.
knativeServing:
  enabled: true

# Git tooling shared by every entry in the KDexClusterFaaSAdaptor's
# generators list. host-manager spawns codegen Jobs whose
# git-checkout / generate-code / git-push init containers all run this
# image; the image must ship `git`, `durl` and the
# git_checkout / git_push / patch_source_status scripts from
# ghcr.io/kdex-tech/cli-tools. 0.3.12+ bundles the safe.directory
# workaround required when the codegen Job's EmptyDir mounts as
# root:root (the default in PSSRestricted pods without fsGroup) — see
# kdex-tech/cli-tools#1.
generatorGit:
  image:
    repository: ghcr.io/kdex-tech/cli-tools
    tag: "0.3.12"
  committerEmail: test@kdex.dev
  committerName: KDex Codegen Bot

# Observer Job pod placement applied to the KDexClusterFaaSAdaptor's
# observer block. host-manager forwards these onto the per-function
# observer CronJob's PodSpec (host-manager v0.2.103+ wire-up,
# kdex-crds v0.14.224+ schema). When empty the observer Job lands
# wherever the scheduler picks — typically the only untainted amd64
# pool the cluster has, which on some deployments is a dedicated
# kpack-build pool that should be free to scale to zero in quiet
# periods. Setting a per-cluster nodeSelector + matching tolerations
# steers the every-5-min observer ticks to the operator-chosen pool.
observer:
  # Map of node labels the observer Job pods must match.
  nodeSelector: {}
  # List of tolerations to apply to observer Job pods. Pair with
  # nodeSelector when steering to a tainted node pool.
  tolerations: []

# Deployer JOB pod placement applied to the KDexClusterFaaSAdaptor's
# deployer block. host-manager forwards these onto the per-function
# deployer Job's own PodSpec (host-manager v0.4.27+ wire-up, kdex-crds
# v0.14.236+ schema). These steer the short-lived deployer Job pod
# ITSELF — not the Knative Service runtime pod. (Runtime-pod scheduling
# is separate: per-function on KDexFunction.spec.{nodeSelector,
# tolerations}, or the adaptor's deployer.{nodeSelector,tolerations}
# which are forwarded as runtime-pod payload — hence the Job* prefix
# here, so the two can't be confused.) Without these the deployer Job
# can only land on an untainted pool, so a cluster that taints every
# pool by purpose has no lever over it. Mirrors observer above; see
# kdex-tech/host-manager#164.
deployer:
  # Map of node labels the deployer Job pod must match. Renders as the
  # CRD's deployer.jobNodeSelector.
  jobNodeSelector: {}
  # List of tolerations to apply to the deployer Job pod. Pair with
  # jobNodeSelector when steering to a tainted node pool. Renders as the
  # CRD's deployer.jobTolerations.
  jobTolerations: []

# Builder configuration applied to every entry in the
# KDexClusterFaaSAdaptor's builders list. host-manager stamps these
# onto the per-function kpack.io/Image's spec.* when the function is
# in codegen mode (no spec.origin.source pre-set on the CR).
builders:
  # serviceAccountName governs the kpack BUILD pod's registry-push
  # identity. The named SA must exist in each KDexFunction's namespace
  # and carry the Workload-Identity annotation pointing at a GSA with
  # roles/artifactregistry.writer on the image registry. Empty string
  # preserves legacy behavior (host-manager falls back to its own SA,
  # which typically lacks AR write — builds fail with
  # "Permission 'artifactregistry.repositories.uploadArtifacts' denied").
  serviceAccountName: ""

  # resources are forwarded onto the kpack.io/Image's
  # spec.build.resources. Use to cap or guarantee CPU/memory for the
  # BUILD pod; especially relevant for compile-heavy languages (Go,
  # Rust) whose link/compile steps can exceed kpack's default 256Mi
  # best-effort QoS budget and either OOM-kill or thrash. Empty map
  # leaves it at the chart-level default (no resources block → kpack's
  # own internal defaults take over).
  resources: {}

  # env is forwarded onto the kpack.io/Image's spec.build.env. Each
  # entry is passed to every buildpack in the lifecycle. Use this to
  # cross-compile to a different runtime architecture than the build
  # node: e.g. GOOS=linux GOARCH=arm64 produces an arm64 function image
  # from an amd64 build pod. Without a matching arch, function pods
  # crash with "exec /cnb/process/cmd: exec format error" — the
  # kpack-built amd64 binary can't run on arm64. Empty list leaves the
  # default (build host's architecture).
  #
  # Cross-compiling is no longer REQUIRED to target arm64. It was, while
  # the bundled kpack shipped amd64-only images and the build pool had to
  # stay amd64 as a result. kpack v0.18.0 (bundled here) publishes genuine
  # multi-arch controller/webhook/build-init/lifecycle/completion images,
  # and the Paketo jammy stacks and buildpacks this chart references are
  # already multi-arch, so a build pod can run natively on an arm64 pool
  # and emit an arm64 image with no cross-compile. Native arm64 needs the
  # build pool to actually offer arm64 nodes: see builder.nodeSelector /
  # builder.tolerations, and the kpack.* scheduling keys for the control
  # plane. Cross-compiling remains valid when you deliberately want to
  # build on one arch and run on another.
  env: []

  # cache.volumeSize is forwarded onto the kpack.io/Image's
  # spec.cache.volume.size, which kpack passes onto the per-Image
  # PVC sized for build-layer reuse across builds. kpack's own
  # default when this field is unset on the Image is "2G", which
  # is too small for typical Go/Rust dep trees: the cache thrashes
  # and link/compile peaks blow past the container memory budget.
  # 10Gi works comfortably for the languages this chart's builders
  # ship (go, rust via tiny; nodejs, python via base). Bump up
  # freely if your dep trees demand it; never bump down (k8s
  # forbids shrinking PVCs and the kpack controller will error
  # every reconcile until the spec is bumped back up or the PVC
  # is deleted). Requires kdex-crds v0.14.217+ which added the
  # Builder.Cache field plumbed through here.
  cache:
    volumeSize: "10Gi"

  # nodeSelector is forwarded onto the kpack.io/Image's
  # spec.build.nodeSelector. Use to pin BUILD pods to a specific node
  # pool when more than one pool can satisfy the build's architecture
  # requirement. Empty map leaves BUILD pod placement to the scheduler.
  nodeSelector: {}

  # tolerations are forwarded onto the kpack.io/Image's
  # spec.build.tolerations, which kpack passes onto the per-build Pod.
  # Use to land BUILD pods on a TAINTED node pool -- most usefully a
  # preemptible/Spot pool, since a buildpack build is a short-lived
  # batch job whose worst case on preemption is a retry.
  #
  # Without this, a Spot pool silently rejects build pods at schedule
  # time (they sit Pending, they do not fail), so the build pool has to
  # stay on-demand AND untainted -- which also makes it the sink for
  # every other unpinned pod in the cluster.
  #
  # GKE Spot example (the taint is auto-applied by GKE):
  #   tolerations:
  #   - key: cloud.google.com/gke-spot
  #     operator: Equal
  #     value: "true"
  #     effect: NoSchedule
  #
  # Mirrors observer.tolerations above. Requires kdex-crds with the
  # Builder.Tolerations/NodeSelector fields and host-manager v0.2.55+,
  # which forwards them onto spec.build.*.
  tolerations: []

# Install the bundled kpack release (CRDs + controllers + ClusterBuilders).
# Disable when kpack is managed externally.
kpack:
  enabled: true
  # Enable kpack's experimental subpath filtering (kpack >= v0.17.2): for an
  # Image whose git revision is a BRANCH (not a pinned SHA) with subPath set,
  # kpack only cuts a new Build when files under subPath change (in-memory
  # shallow clone + git ls-tree hash compare). Lets a content change in a
  # hand-authored / local-codegen KDexFunction source trigger a rebuild with
  # no in-cluster codegen. Dormant for SHA-pinned and service-backed
  # functions. See kpack docs/subpath_filtering.md.
  gitResolverUseShallowClone: false
  builder:
    tag: "latest"
  # Scheduling for kpack-controller and kpack-webhook. nodeSelector
  # replaces the chart default ({kubernetes.io/os: linux}); include that
  # key explicitly if you want to keep the OS filter. tolerations is
  # additive: empty by default, leaves the pods with no extra tolerations.
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []
  affinity: {}
